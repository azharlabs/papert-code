name: ci-lanes

on:
  pull_request:
  workflow_dispatch:

jobs:
  cli-lane:
    name: cli-lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core dependency
        run: npm run build --workspace packages/core

      - name: Typecheck CLI
        run: npm run typecheck --workspace packages/cli

      - name: Test CLI
        run: npm run test --workspace packages/cli -- --coverage.enabled=false

  sdk-lane:
    name: sdk-lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build core dependency
        run: npm run build --workspace packages/core

      - name: Typecheck TypeScript SDK
        run: npm run typecheck --workspace packages/sdk-typescript

      - name: Test TypeScript SDK
        run: npm run test --workspace packages/sdk-typescript -- --coverage.enabled=false

      - name: Install Python SDK test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/sdk-python/requirements.txt -r packages/sdk-python/requirements-dev.txt

      - name: Test Python SDK
        run: pytest -q packages/sdk-python/tests

  sandbox-integration-lane:
    name: sandbox-integration-lane
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sandbox-none integration suite
        run: npm run test:integration:sandbox:none
