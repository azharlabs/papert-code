name: integration-deflake

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  deflake:
    name: deflake-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sandbox-none
            command: npm run test:integration:sandbox:none
            attempts: 3
          - id: terminal-bench
            command: npm run test:terminal-bench:oracle
            attempts: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deflake attempts
        run: |
          node scripts/ci/deflake-integration.mjs \
            --command "${{ matrix.command }}" \
            --attempts "${{ matrix.attempts }}" \
            --out-json ".artifacts/deflake/${{ matrix.id }}.json" \
            --out-md ".artifacts/deflake/${{ matrix.id }}.md"

      - name: Publish deflake summary
        if: always()
        run: |
          if [ -f ".artifacts/deflake/${{ matrix.id }}.md" ]; then
            cat ".artifacts/deflake/${{ matrix.id }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deflake artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deflake-${{ matrix.id }}
          path: .artifacts/deflake/
